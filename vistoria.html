<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Japan Security | Vistoria</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        :root { --primary: #e63946; --bg: #121212; --card: #1a1a1a; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 0; }
        
        header { 
            background: #1a1a1a; padding: 15px; display: flex; align-items: center; 
            justify-content: space-between; border-bottom: 4px solid #e63946; 
            position: sticky; top: 0; z-index: 1000; 
        }

        .card { background: var(--card); border-radius: 12px; padding: 15px; margin: 10px; border: 1px solid #333; }
        .modern-input { width: 100%; padding: 12px; background: #252525; border: 1px solid #444; color: white; border-radius: 8px; box-sizing: border-box; margin-top: 5px; }
        
        button { cursor: pointer; border: none; border-radius: 8px; font-weight: bold; transition: 0.3s; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; color: var(--primary); font-size: 0.7rem; padding: 10px; border-bottom: 2px solid #333; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #222; font-size: 0.85rem; vertical-align: top; }
        
        .btn-acao { padding: 8px; border-radius: 6px; color: white; border: none; margin-top: 5px; }
        .btn-foto { background: #3498db; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; margin-top: 5px; }
        .stats { display: grid; grid-template-columns: 1fr; gap: 10px; padding: 10px 10px 0 10px; }
        .stat-box { background: #1a1a1a; padding: 10px; border-radius: 8px; text-align: center; border-bottom: 3px solid #3498db; }

        .checklist-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
            background: #222;
            padding: 10px;
            border-radius: 8px;
        }
        .checklist-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #ccc;
        }
        .checklist-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }
        .badge-chk {
            display: inline-block;
            background: #222;
            border: 1px solid #444;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.65rem;
            margin-top: 4px;
            margin-right: 2px;
        }
        .badge-ok { color: #2ecc71; border-color: #2ecc71; }
        .badge-nok { color: #e74c3c; border-color: #e74c3c; }
    </style>
</head>
<body>

    <header>
        <a href="dashboard.html" style="color: white; text-decoration: none; font-size: 0.9rem; font-weight: bold; display: flex; align-items: center; gap: 8px;">
            <i class="fas fa-chevron-left" style="color: #e63946;"></i> VOLTAR
        </a>
        <div style="color: #e63946; font-weight: 900; font-size: 0.8rem; letter-spacing: 2px;">VISTORIA VEICULAR</div>
        <div style="width: 50px;"></div>
    </header>

    <div class="stats">
        <div class="stat-box">
            <small style="color:#888; font-size:0.6rem;">VISTORIAS EXIBIDAS</small>
            <div id="resumoQtd" style="font-weight:bold;">0</div>
        </div>
    </div>

    <!-- FORMULÁRIO DE NOVA VISTORIA -->
    <div class="card">
        <h3 style="color:var(--primary); margin: 0 0 15px 0; font-size: 1rem;"><i class="fas fa-clipboard-check"></i> Nova Vistoria</h3>
        
        <label style="font-size:0.7rem; color:#888;">VIATURA (PLACA)</label>
        <input list="listaVeiculos" id="v_veiculo" class="modern-input" placeholder="Selecione a placa...">
        <datalist id="listaVeiculos"></datalist>
        
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <div style="flex:1">
                <label style="font-size:0.7rem; color:#888;">DATA/HORA</label>
                <input type="datetime-local" id="v_data" class="modern-input">
            </div>
            <div style="flex:1">
                <label style="font-size:0.7rem; color:#888;">KM ATUAL</label>
                <input type="number" id="v_km" class="modern-input" placeholder="Ex: 150000">
            </div>
        </div>

        <label style="font-size:0.7rem; color:#888; margin-top:15px; display:block;"><i class="fas fa-tasks"></i> CHECKLIST DE VERIFICAÇÃO</label>
        <div class="checklist-grid">
            <label class="checklist-item"><input type="checkbox" id="chk_pneus" checked> Pneus / Estepe</label>
            <label class="checklist-item"><input type="checkbox" id="chk_oleo" checked> Nível de Óleo</label>
            <label class="checklist-item"><input type="checkbox" id="chk_agua" checked> Nível de Água</label>
            <label class="checklist-item"><input type="checkbox" id="chk_farois" checked> Faróis / Lanternas</label>
            <label class="checklist-item"><input type="checkbox" id="chk_funilaria" checked> Lataria / Pintura</label>
            <label class="checklist-item"><input type="checkbox" id="chk_limpeza" checked> Limpeza / Interna</label>
        </div>

        <label style="font-size:0.7rem; color:#888; margin-top:10px; display:block;">OBSERVAÇÕES / DANOS ENCONTRADOS</label>
        <input type="text" id="v_obs" class="modern-input" placeholder="Ex: Arranhão no para-choque dianteiro">

        <label style="font-size:0.7rem; color:#888; margin-top:10px; display:block;"><i class="fas fa-camera"></i> TIRAR FOTO DO VEÍCULO / AVARIA</label>
        <input type="file" id="v_foto" accept="image/*" capture="environment" class="modern-input">
        
        <button id="btnSalvar" style="width:100%; background:var(--primary); color:white; padding: 15px; margin-top:20px;">
            <i class="fas fa-save"></i> SALVAR VISTORIA
        </button>
    </div>

    <!-- FILTRO POR DATA E HORA -->
    <div class="card" style="border-left: 4px solid #3498db;">
        <label style="font-size:0.7rem; color:#3498db; font-weight:bold;">FILTRAR HISTÓRICO POR DATA E HORA</label>
        <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px;">
            <div>
                <small style="color:#888; font-size:0.65rem;">INÍCIO</small>
                <input type="datetime-local" id="f_ini" class="modern-input" style="margin-top:2px;">
            </div>
            <div>
                <small style="color:#888; font-size:0.65rem;">FIM</small>
                <input type="datetime-local" id="f_fim" class="modern-input" style="margin-top:2px;">
            </div>
            <button id="btnFiltrar" style="background:#3498db; color:white; padding:12px; width:100%; margin-top:4px;">
                <i class="fas fa-search"></i> FILTRAR HISTÓRICO
            </button>
        </div>
    </div>

    <!-- HISTÓRICO -->
    <div class="card">
        <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h3 style="margin:0; font-size: 1rem;">Histórico</h3>
            <button id="btnPDF" style="background:#27ae60; color:white; padding:8px 12px; font-size:0.75rem;"><i class="fas fa-file-pdf"></i> GERAR RELATÓRIO</button>
        </div>
        <div id="status" style="font-size:0.8rem; color:#888; text-align:center;">Carregando...</div>
        <table>
            <thead>
                <tr>
                    <th>Detalhes</th>
                    <th style="text-align:right;">Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaCorpo"></tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDczjdNxa2TZP07iiwTAkOLFbKcOPx1POo",
            authDomain: "japan-security-car-1a7d8.firebaseapp.com",
            projectId: "japan-security-car-1a7d8",
            storageBucket: "japan-security-car-1a7d8.firebasestorage.app",
            messagingSenderId: "616009365036",
            appId: "1:616009365036:web:f644dd6106818566900389"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const auth = getAuth(app);

        let editId = null;
        let fotoUrlExistente = "";
        let dadosLocais = [];

        onAuthStateChanged(auth, (user) => {
            if (user) { 
                carregarVeiculos();
                carregarHistorico(); 
            } else { 
                window.location.href = "login.html"; 
            }
        });

        async function carregarVeiculos() {
            const snap = await getDocs(collection(db, "veiculos"));
            const list = document.getElementById('listaVeiculos');
            list.innerHTML = "";
            snap.forEach(d => { list.innerHTML += `<option value="${d.data().placa}">`; });
        }

        async function carregarHistorico() {
            const corpo = document.getElementById('tabelaCorpo');
            const status = document.getElementById('status');
            
            const iniVal = document.getElementById('f_ini').value;
            const fimVal = document.getElementById('f_fim').value;
            
            const timeIni = iniVal ? new Date(iniVal).getTime() : 0;
            const timeFim = fimVal ? new Date(fimVal).getTime() : Infinity;

            try {
                const q = query(collection(db, "vistorias"), where("usuario", "==", auth.currentUser.email));
                const snap = await getDocs(q);
                corpo.innerHTML = "";
                dadosLocais = [];

                snap.forEach(d => {
                    const item = { id: d.id, ...d.data() };
                    const t = item.timestamp || (item.dataISO ? new Date(item.dataISO).getTime() : 0);
                    
                    if (t >= timeIni && t <= timeFim) {
                        dadosLocais.push(item);
                    }
                });

                dadosLocais.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

                if (dadosLocais.length === 0) {
                    status.innerText = "Nenhuma vistoria encontrada.";
                } else {
                    status.innerText = "";
                    dadosLocais.forEach(item => {
                        const linkFoto = item.fotoUrl 
                            ? `<a href="${item.fotoUrl}" target="_blank" class="btn-foto"><i class="fas fa-camera"></i> FOTO</a>` 
                            : '';

                        const chk = item.checklist || {};
                        const renderBadge = (label, statusOk) => 
                            `<span class="badge-chk ${statusOk ? 'badge-ok' : 'badge-nok'}">${label}: ${statusOk ? 'OK' : 'NOK'}</span>`;

                        const htmlChecklist = `
                            <div style="margin-top: 5px;">
                                ${renderBadge('Pneus', chk.pneus)}
                                ${renderBadge('Óleo', chk.oleo)}
                                ${renderBadge('Água', chk.agua)}
                                ${renderBadge('Faróis', chk.farois)}
                                ${renderBadge('Lataria', chk.funilaria)}
                                ${renderBadge('Limpeza', chk.limpeza)}
                            </div>
                        `;

                        corpo.innerHTML += `
                            <tr>
                                <td>
                                    <small style="color:#888; font-size:0.65rem;">${item.dataExibicao}</small><br>
                                    <b style="color:var(--primary)">${item.veiculo}</b><br>
                                    <span>${item.observacoes || 'Sem observações'}</span><br>
                                    <small style="color:#3498db">KM: ${item.km || '-'}</small><br>
                                    ${htmlChecklist}
                                    ${linkFoto}
                                </td>
                                <td style="text-align:right;">
                                    <button onclick="window.editar('${item.id}')" class="btn-acao" style="background:#3498db;"><i class="fas fa-edit"></i></button>
                                    <button onclick="window.excluir('${item.id}')" class="btn-acao" style="background:#e63946;"><i class="fas fa-trash"></i></button>
                                </td>
                            </tr>
                        `;
                    });
                }
                document.getElementById('resumoQtd').innerText = dadosLocais.length;
            } catch (e) { status.innerText = "Erro ao carregar histórico."; }
        }

        function comprimirImagem(file, maxWidth = 1024, quality = 0.7) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => { resolve(blob); }, 'image/jpeg', quality);
                    };
                };
            });
        }

        document.getElementById('btnSalvar').onclick = async () => {
            const btn = document.getElementById('btnSalvar');
            const vtr = document.getElementById('v_veiculo').value.toUpperCase().trim();
            if(!vtr) return alert("Informe a placa do veículo");

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> SALVANDO...`;

            const dataInput = document.getElementById('v_data').value;
            const dObj = dataInput ? new Date(dataInput) : new Date();
            const kmAtualDigitado = parseInt(document.getElementById('v_km').value) || 0;
            const obsTexto = document.getElementById('v_obs').value;
            const fileInput = document.getElementById('v_foto');

            const checklistObj = {
                pneus: document.getElementById('chk_pneus').checked,
                oleo: document.getElementById('chk_oleo').checked,
                agua: document.getElementById('chk_agua').checked,
                farois: document.getElementById('chk_farois').checked,
                funilaria: document.getElementById('chk_funilaria').checked,
                limpeza: document.getElementById('chk_limpeza').checked
            };

            try {
                let fotoUrl = fotoUrlExistente;

                if (fileInput.files.length > 0) {
                    btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> OTIMIZANDO FOTO...`;
                    const blobComprimido = await comprimirImagem(fileInput.files[0]);
                    const storageRef = ref(storage, `vistorias/${Date.now()}_foto.jpg`);
                    await uploadBytes(storageRef, blobComprimido);
                    fotoUrl = await getDownloadURL(storageRef);
                }

                const dados = {
                    veiculo: vtr,
                    km: kmAtualDigitado || "",
                    checklist: checklistObj,
                    observacoes: obsTexto,
                    dataExibicao: dObj.toLocaleString('pt-BR'),
                    dataISO: dObj.toISOString(),
                    timestamp: dObj.getTime(),
                    fotoUrl: fotoUrl,
                    usuario: auth.currentUser.email
                };

                if(editId) {
                    await updateDoc(doc(db, "vistorias", editId), dados);
                } else {
                    await addDoc(collection(db, "vistorias"), dados);
                }

                if(kmAtualDigitado > 0) {
                    const qVeiculo = query(collection(db, "veiculos"), where("placa", "==", vtr));
                    const snapVeiculo = await getDocs(qVeiculo);
                    if (!snapVeiculo.empty) {
                        const veiculoDoc = snapVeiculo.docs[0];
                        await updateDoc(doc(db, "veiculos", veiculoDoc.id), { kmAtual: kmAtualDigitado });
                    }
                }

                location.reload();
            } catch (e) {
                console.error("Erro ao salvar vistoria: ", e);
                alert("Erro ao salvar.");
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-save"></i> SALVAR VISTORIA`;
            }
        };

        window.editar = (id) => {
            const d = dadosLocais.find(x => x.id === id);
            editId = id;
            fotoUrlExistente = d.fotoUrl || "";
            document.getElementById('v_veiculo').value = d.veiculo;
            document.getElementById('v_km').value = d.km;
            document.getElementById('v_obs').value = d.observacoes;
            if(d.dataISO) document.getElementById('v_data').value = d.dataISO.substring(0, 16);
            
            const chk = d.checklist || {};
            document.getElementById('chk_pneus').checked = chk.pneus ?? true;
            document.getElementById('chk_oleo').checked = chk.oleo ?? true;
            document.getElementById('chk_agua').checked = chk.agua ?? true;
            document.getElementById('chk_farois').checked = chk.farois ?? true;
            document.getElementById('chk_funilaria').checked = chk.funilaria ?? true;
            document.getElementById('chk_limpeza').checked = chk.limpeza ?? true;

            document.getElementById('btnSalvar').innerHTML = "<i class='fas fa-sync'></i> ATUALIZAR";
            window.scrollTo(0,0);
        };

        window.excluir = async (id) => {
            if(confirm("Deseja excluir este registro de vistoria?")) { 
                await deleteDoc(doc(db, "vistorias", id)); 
                carregarHistorico(); 
            }
        };

        document.getElementById('btnFiltrar').onclick = carregarHistorico;

        // GERAR RELATÓRIO PDF EM BLOCOS SEPARADOS POR VEÍCULO
        document.getElementById('btnPDF').onclick = () => {
            const { jsPDF } = window.jspdf;
            const docPDF = new jsPDF();
            
            const corVermelha = [190, 20, 20];
            const corCinza = [180, 180, 180];

            // Cabeçalho Principal (Banner Vermelho)
            docPDF.setFillColor(...corVermelha);
            docPDF.rect(0, 0, 210, 25, 'F');
            
            docPDF.setTextColor(255, 255, 255);
            docPDF.setFontSize(15);
            docPDF.setFont("helvetica", "bold");
            docPDF.text("JAPAN SECURITY - RELATÓRIO TÉCNICO", 105, 12, { align: "center" });

            // Formatação do Período
            const iniVal = document.getElementById('f_ini').value;
            const fimVal = document.getElementById('f_fim').value;
            const periodoTexto = `Período: ${iniVal || 'Início'} até ${fimVal || 'Atual'}`;
            
            docPDF.setFontSize(9);
            docPDF.setFont("helvetica", "normal");
            docPDF.text(periodoTexto, 105, 19, { align: "center" });

            let posY = 35;

            dadosLocais.forEach((item, index) => {
                // Quebra de página se não houver espaço suficiente para o próximo bloco
                if (posY > 255) {
                    docPDF.addPage();
                    posY = 20;
                }

                // VTR / Placa (Cor Vermelha e Negrito)
                docPDF.setFontSize(11);
                docPDF.setFont("helvetica", "bold");
                docPDF.setTextColor(...corVermelha);
                docPDF.text(`VTR: ${item.veiculo}`, 14, posY);

                // Data / Hora alinhado à direita
                docPDF.setFontSize(9);
                docPDF.setFont("helvetica", "bold");
                docPDF.setTextColor(0, 0, 0);
                docPDF.text(`DATA: ${item.dataExibicao || '-'}`, 196, posY, { align: "right" });

                posY += 6;

                // KM e Colaborador
                docPDF.setFontSize(9);
                docPDF.setFont("helvetica", "bold");
                docPDF.text("KM: ", 14, posY);
                
                docPDF.setFont("helvetica", "normal");
                const nomeUsuario = item.usuario ? item.usuario.split('@')[0].toUpperCase() : 'N/I';
                docPDF.text(`${item.km || '-'}  |  Colaborador: ${nomeUsuario}`, 23, posY);

                posY += 6;

                // Checklist em Linha
                docPDF.setFont("helvetica", "bold");
                docPDF.text("CHECKLIST: ", 14, posY);

                const c = item.checklist || {};
                const chkTexto = `Água: ${c.agua?'OK':'NOK'} | Óleo: ${c.oleo?'OK':'NOK'} | Faróis: ${c.farois?'OK':'NOK'} | Lataria: ${c.funilaria?'OK':'NOK'} | Pneus: ${c.pneus?'OK':'NOK'} | Limpeza: ${c.limpeza?'OK':'NOK'}`;

                docPDF.setFont("helvetica", "normal");
                const linhasChk = docPDF.splitTextToSize(chkTexto, 155);
                docPDF.text(linhasChk, 37, posY);

                posY += (linhasChk.length * 5) + 2;

                // Observações
                docPDF.setFont("helvetica", "bold");
                docPDF.text("OBSERVAÇÕES: ", 14, posY);
                docPDF.setFont("helvetica", "normal");
                const obsTexto = item.observacoes ? item.observacoes.toUpperCase() : "SEM OBS";
                docPDF.text(obsTexto, 43, posY);

                posY += 8;

                // Linha Divisória Fina entre os Blocos
                if (index < dadosLocais.length - 1) {
                    docPDF.setDrawColor(...corCinza);
                    docPDF.setLineWidth(0.3);
                    docPDF.line(14, posY, 196, posY);
                    posY += 10;
                }
            });

            docPDF.save("Relatorio_Tecnico_Japan_Security.pdf");
        };
    </script>
</body>
</html>
